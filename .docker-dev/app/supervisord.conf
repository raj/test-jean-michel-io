[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
chmod=0700
chown=app:app

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0

[program:messenger-consume]
command=php /var/application/bin/console messenger:consume insert_async --limit=100 --time-limit=3600
user=app
numprocs=1
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0