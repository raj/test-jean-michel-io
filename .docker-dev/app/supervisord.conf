[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
chmod=0700
chown=app:app

[program:symfony-server]
command=symfony server:start --port=8000 --no-tls --allow-all-ip
user=app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:messenger-consume]
command=php /var/application/bin/console messenger:consume insert_async --limit=100 --time-limit=3600
user=app
numprocs=1
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0